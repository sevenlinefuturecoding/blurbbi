<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Offline · Blurbbi</title>
    <meta name="theme-color" content="#FF6B4A" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0c0c0e;
        --card: #151518;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f3f3f5;
        --muted: #8b8b93;
        --primary: #ff6b4a;
        --primary-glow: rgba(255, 107, 74, 0.25);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .offline-card {
        background-color: var(--card);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 40px 28px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .logo-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        background: linear-gradient(135deg, #ff6b4a, #e03e1a);
        box-shadow: 0 10px 25px var(--primary-glow);
      }
      .logo-icon svg {
        width: 42px;
        height: 42px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      p {
        font-size: 14.5px;
        line-height: 1.5;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 24px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        border: none;
        background-color: var(--primary);
        color: #ffffff;
        box-shadow: 0 4px 14px var(--primary-glow);
      }
      .btn:hover {
        background-color: #ff5631;
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: rgba(255, 107, 74, 0.12);
        color: var(--primary);
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 107, 74, 0.25);
        margin-bottom: 16px;
      }
      .pulse-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: var(--primary);
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.85);
        }
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="logo-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M22 16 C22 14.895 22.895 14 24 14 C25.105 14 26 14.895 26 16 L26 31 C28.2 28.5 31.4 27 35 27 C42.18 27 48 32.82 48 40 C48 47.18 42.18 53 35 53 C27.82 53 22 47.18 22 40 Z M26 40 C26 44.97 30.03 49 35 49 C39.97 49 44 44.97 44 40 C44 35.03 39.97 31 35 31 C30.03 31 26 35.03 26 40 Z"
            fill="#FFFFFF"
          />
          <circle cx="35" cy="40" r="4.5" fill="#FFFFFF" />
        </svg>
      </div>

      <div class="status-pill">
        <span class="pulse-dot"></span>
        <span>Offline Mode</span>
      </div>

      <h1>You're currently offline</h1>
      <p>
        Blurbbi is waiting for your internet connection. Cached drops and preferences will remain
        available once you're back online.
      </p>

      <button class="btn" onclick="window.location.reload()">Try reconnecting</button>
    </div>
  </body>
</html>
